[variables]
APP_PORT = "8000"
PYTHON_VERSION = "3.13"

[phases.setup]
nixPkgs = ["python313", "gcc", "uv"]

[phases.install]
cmds = [
  "cd backend",
  "uv venv --copies /opt/venv",
  ". /opt/venv/bin/activate && uv pip install -r requirements.txt",
  "mkdir -p data",
  "uv run python -m app.seed",
]

[start]
cmd = ". /opt/venv/bin/activate && cd backend && uv run uvicorn app:app --host 0.0.0.0 --port ${APP_PORT:-8000}"

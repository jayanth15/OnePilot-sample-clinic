[variables]
APP_PORT = "8000"
PYTHON_VERSION = "3.13"

[phases.setup]
nixPkgs = ["python313", "gcc", "uv"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  "uv pip install --python /opt/venv/bin/python -r requirements.txt",
  "mkdir -p data",
  "/opt/venv/bin/python -m app.seed"
]

[start]
cmd = "/opt/venv/bin/python -m uvicorn app:app --host 0.0.0.0 --port ${APP_PORT:-8000}"
